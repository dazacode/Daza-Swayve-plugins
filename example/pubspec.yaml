name: swayve_plugin_example
description: >-
  The reference Swayve plugin: pure Dart, fully offline, and small enough to
  read end to end. Serves a hand-written fixture catalogue through the search
  and catalog provider interfaces.
version: 0.1.0
publish_to: none
repository: https://github.com/dazacode/Daza-Swayve-plugins
issue_tracker: https://github.com/dazacode/Daza-Swayve-plugins/issues

environment:
  sdk: ^3.6.0

# A plugin depends on the SDK and on nothing else. Every capability it needs
# from the outside world — HTTP, storage, secrets, a web view — arrives through
# `SwayvePluginContext`, so there is no reason to take a direct dependency on a
# transport or a storage package. This plugin does not even use those.
#
# The SDK lives in a separate repository now, so this is a `git:` dependency
# rather than `path:` — see that repo's README for why a plugin developed
# outside swayve-plugins always depends on the SDK this way.
dependencies:
  swayve_plugin_sdk:
    git:
      url: https://github.com/dazacode/swayve-plugins.git
      path: packages/swayve_plugin_sdk
      ref: 57b2e052f667cc8e3e53661f82aace47492d16db

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
