<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="YouTube Music plugin for Swayve">
  <title>YouTube Music plugin for Swayve</title>
  <!--
    An original mark for this plugin. It is deliberately not derived from, and
    not similar to, any Google or YouTube logo: no red rounded rectangle, no
    white play triangle, no wordmark. It is an abstract waveform inside a ring,
    meaning "audio arriving over a connection". See licenses/NOTICE.md.
  -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#1F2933" stroke-width="4" />
  <g fill="#1F2933">
    <rect x="19" y="27" width="4.5" height="10" rx="2.25" />
    <rect x="27" y="20" width="4.5" height="24" rx="2.25" />
    <rect x="35" y="24" width="4.5" height="16" rx="2.25" />
    <rect x="43" y="29" width="4.5" height="6" rx="2.25" />
  </g>
</svg>
