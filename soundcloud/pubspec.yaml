name: soundcloud
description: >-
  Adds SoundCloud search, browsing and playback to Swayve through the Swayve
  plugin SDK, in pure Dart, using SoundCloud's public unauthenticated API.
version: 0.1.0
publish_to: none
repository: https://github.com/dazacode/Daza-Swayve-plugins
issue_tracker: https://github.com/dazacode/Daza-Swayve-plugins/issues

environment:
  sdk: ^3.6.0

# Pure Dart. No Flutter, no HTTP stack, no media library: every capability
# this plugin needs is host-mediated through `SwayvePluginContext`. See the
# "Dependencies we deliberately do not have" section of README.md.
#
# The SDK lives in a separate repository now, so this is a `git:` dependency
# rather than `path:` — see that repo's README for why a plugin developed
# outside swayve-plugins always depends on the SDK this way.
dependencies:
  swayve_plugin_sdk:
    git:
      url: https://github.com/dazacode/swayve-plugins.git
      path: packages/swayve_plugin_sdk
      ref: 21a22e392a32cf9fdf385f6b556bd999d9905a4d

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
